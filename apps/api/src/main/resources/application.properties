spring.application.name=ai-test-platform-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_test_platform}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway (db/migration) owns the schema; Hibernate only validates its entity
# mappings match rather than generating/altering DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Per-job upload directory: the submitted sheet, and (until Phase 3's encrypted
# job_secrets table exists) a plaintext credentials file the worker reads once and
# deletes after claiming the job. See JobStorageService.
app.storage.jobs-root=${JOBS_STORAGE_ROOT:./data/jobs}
