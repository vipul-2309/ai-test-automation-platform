spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Tests use Hibernate to generate the schema straight from the entity mappings
# against H2, instead of running the real V1__create_jobs_table.sql (hand-written
# for Postgres) through Flyway - see the pom.xml comment on the h2 dependency.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

app.storage.jobs-root=./target/test-data/jobs
